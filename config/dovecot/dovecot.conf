# Dovecot 2.4 CE — km0-mail (PostgreSQL virtual users, Maildir, LMTP, IMAPS)
# Auth (mechanisms, oauth2, passdb/userdb) rendered at start — see docker/dovecot/entrypoint.sh

dovecot_config_version = 2.4.4
dovecot_storage_version = 2.4.4

protocols = imap lmtp

listen = *, ::

mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

!include /run/dovecot/auth-local.conf

service auth {
  # Postfix SMTP SASL (TCP across Docker network)
  inet_listener postfix {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

ssl = required
ssl_server_cert_file = /run/dovecot/ssl/dovecot.pem
ssl_server_key_file = /run/dovecot/ssl/dovecot.key
ssl_min_protocol = TLSv1.2
