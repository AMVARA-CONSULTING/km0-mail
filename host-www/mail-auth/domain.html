<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="domainTitle">Verify your domain</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/km0-auth.css" />
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.svg" alt="KM0 Digital" width="64" height="64" />
    <h1 data-i18n="domainTitle">Verify your domain</h1>
    <p class="intro" data-i18n="domainIntro">Add these DNS records at your registrar, then click Check again.</p>
    <p class="intro" id="domain-name"></p>

    <div id="dns-records"></div>
    <div class="banner banner--error" id="domain-error" role="alert"></div>

    <button type="button" class="btn-primary" id="check-dns" data-i18n="checkDns">Check again</button>
    <a class="text-link" href="/login.html" data-i18n="signInLink">Back to sign in</a>
  </div>
  <script src="/km0-auth-i18n.js"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var domain = params.get('domain') || '';
      document.getElementById('domain-name').textContent = domain;

      function renderStatus(data) {
        var box = document.getElementById('dns-records');
        box.innerHTML = '';
        var dns = data.dns || {};
        ['txt', 'mx', 'spf', 'dkim'].forEach(function (key) {
          var rec = dns[key];
          if (!rec) return;
          var check = (data.checks || {})[key + '_verified'];
          var div = document.createElement('div');
          div.className = 'dns-record';
          div.innerHTML = '<strong>' + key.toUpperCase() + '</strong> '
            + '<span class="dns-status ' + (check ? 'dns-status--ok' : 'dns-status--pending') + '">'
            + (check ? 'OK' : 'Pending') + '</span>'
            + '<code>' + (rec.host || '@') + ' → ' + (rec.value || '') + '</code>';
          box.appendChild(div);
        });
      }

      function loadStatus() {
        fetch('/api/mail/domain/' + encodeURIComponent(domain) + '/status')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            renderStatus(data);
            var c = data.checks || {};
            if (c.txt_verified && c.mx_verified && c.spf_verified && c.dkim_verified) {
              location.href = '/login.html?registered=1';
            }
          })
          .catch(function () {});
      }

      document.getElementById('check-dns').addEventListener('click', function () {
        fetch('/api/mail/domain/' + encodeURIComponent(domain) + '/check', { method: 'POST' })
          .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
          .then(function () { loadStatus(); })
          .catch(function (e) {
            var el = document.getElementById('domain-error');
            el.textContent = e.message || 'Check failed';
            el.classList.add('banner--visible');
          });
      });

      if (domain) loadStatus();
    })();
  </script>
</body>
</html>
