<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="loginTitle">KM0 Mail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/km0-auth.css" />
</head>
<body>
  <div class="card">
    <nav class="km0-lang-switch" role="navigation" aria-label="Language">
      <button type="button" class="km0-lang-switch__btn" data-lang="ca">CA</button>
      <button type="button" class="km0-lang-switch__btn" data-lang="es">ES</button>
      <button type="button" class="km0-lang-switch__btn km0-lang-switch__btn--active" data-lang="en">EN</button>
      <button type="button" class="km0-lang-switch__btn" data-lang="de">DE</button>
    </nav>
    <img class="logo" src="/logo.svg" alt="KM0 Digital" width="72" height="72" />
    <p class="eyebrow" data-i18n="loginEyebrow">Kilometer 0 Digital</p>
    <h1 data-i18n="loginTitle">KM0 Mail</h1>
    <p class="tagline" data-i18n="landingTagline">Local origin · Digital impact</p>
    <p class="intro" data-i18n="loginIntro">Sign in with your mailbox email and password.</p>

    <div class="banner banner--success" id="km0-registered-banner" data-i18n="registerSuccessBanner" role="status"></div>

    <a class="btn-primary" href="/index.php?_task=login" data-i18n="passwordButton">Sign in with email and password</a>

    <a class="text-link" href="/register" data-i18n="registerLink">Create a free account</a>

    <div class="km0-otherways">
      <p class="km0-otherways__label" data-i18n="landingOtherWays">Other ways to sign in</p>
      <button type="button" class="btn-secondary btn-secondary--muted" id="km0-ldap-login" data-i18n="ldapButton">Sign in with OpenCloud / LDAP</button>
      <p class="ldap-hint" data-i18n="ldapHint">Uses your OpenCloud / LDAP account (brief redirect to cloud.km0digital.com).</p>
    </div>

    <footer>
      <a href="https://km0digital.com/" target="_blank" rel="noopener" data-i18n="footerHome">km0digital.com</a>
    </footer>
  </div>
  <script src="/km0-auth-i18n.js"></script>
  <script src="/dex-auth.js"></script>
  <script>
    document.getElementById('km0-ldap-login').addEventListener('click', function () {
      window.KM0DexAuth.startDexLogin();
    });
    try {
      if (new URLSearchParams(location.search).get('registered') === '1') {
        document.getElementById('km0-registered-banner').classList.add('banner--visible');
      }
    } catch (_) {}
  </script>
</body>
</html>
